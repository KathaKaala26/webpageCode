name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    # This file is pushed to two remotes (see .claude/skills/deployment/SKILL.md): origin
    # (SuniketSolutions/KalaaandKathaa) and kathakaala (KathaKaala26/webpageCode). Both now
    # carry valid secrets for the same Vercel project (katha-and-kala), re-added 2026-11-08,
    # so both repos deploy the same commit on every push to main.
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Triggers a remote build on Vercel's own infrastructure (same as a
      # manual `vercel --prod`), rather than pulling env vars and building
      # locally in the runner — local `vercel pull`/`vercel build` has been
      # returning empty placeholder values for this project's env vars.
      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
