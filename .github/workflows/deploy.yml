name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    # This file is pushed to two remotes (see .claude/skills/deployment/SKILL.md): origin
    # (SuniketSolutions/KalaaandKathaa), whose Vercel secrets are valid and do the real
    # deploying, and kathakaala (KathaKaala26/webpageCode), a client-owned repo neither
    # Claude nor this session has admin access to — its copy of these secrets has been
    # failing since 2026-10-30 and can't be fixed from here. Restricting the job to the repo
    # that actually works avoids a false-failure notification on every push to kathakaala
    # without needing the two remotes to carry different file contents.
    if: github.repository == 'SuniketSolutions/KalaaandKathaa'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Triggers a remote build on Vercel's own infrastructure (same as a
      # manual `vercel --prod`), rather than pulling env vars and building
      # locally in the runner — local `vercel pull`/`vercel build` has been
      # returning empty placeholder values for this project's env vars.
      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
