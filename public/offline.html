<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5A1414" />
    <title>Offline | Katha &amp; Kaala</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf4e6; color: #1c1410;
        font-family: "Mulish", system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
      .band { position: fixed; inset: 0 0 auto 0; height: 10px;
        background: repeating-linear-gradient(90deg, #b5261e 0 10px, #e3a21a 10px 14px, #5a1414 14px 24px, #e3a21a 24px 28px); }
      .mark { width: 72px; height: 72px; border-radius: 50%; background: #b5261e; color: #fbf4e6; display: grid; place-items: center;
        font: 700 28px "Cormorant Garamond", Georgia, serif; margin: 0 auto 20px; box-shadow: 0 0 0 4px #fbf4e6, 0 0 0 6px #e3a21a; }
      h1 { font: 600 40px/1.1 "Cormorant Garamond", Georgia, serif; color: #5a1414; margin: 0 0 12px; }
      p { color: #4a3b32; max-width: 420px; margin: 0 auto 24px; line-height: 1.6; }
      button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #b5261e; color: #fbf4e6;
        font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="band"></div>
    <main>
      <div class="mark">KK</div>
      <h1>You’re offline</h1>
      <p>This page hasn’t been saved on your device yet. Pages you’ve already visited — and your cart — are still available. Reconnect to place an order.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>window.addEventListener("online", () => location.reload());</script>
  </body>
</html>
